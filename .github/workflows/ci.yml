name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (Frontend + Product API + DB)
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Run unit & integration test suite (offline mode)
        env:
          REAL_PROVIDER_SMOKE: "off"
          RATE_LIMIT_DISABLED: "true"
        run: npm test -- --run
