services:
  zhuanfang:
    build:
      context: .
      args:
        # 公网经 80 路径反代时设 VITE_BASE=/zhuanfang/ 与同源 API 前缀
        VITE_PRODUCT_API_BASE_URL: ${VITE_PRODUCT_API_BASE_URL:-}
        VITE_BASE: ${VITE_BASE:-/}
    image: zhuanfang:local
    ports:
      - "${PORT:-3210}:3210"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3210
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-production}
      # Machine Bearer (LiveKit agent / CI). Human browser uses PRODUCT_AUTH_ENABLED session cookies.
      PRODUCT_API_TOKEN: ${PRODUCT_API_TOKEN:?生产部署必须设置 PRODUCT_API_TOKEN（机器凭证）；人类登录请同时设 PRODUCT_AUTH_ENABLED + PRODUCT_SESSION_SECRET}
      # L1 账密会话（推荐生产开启）
      PRODUCT_AUTH_ENABLED: ${PRODUCT_AUTH_ENABLED:-1}
      PRODUCT_SESSION_SECRET: ${PRODUCT_SESSION_SECRET:-}
      PRODUCT_BOOTSTRAP_USERS: ${PRODUCT_BOOTSTRAP_USERS:-}
      PRODUCT_SESSION_SECURE: ${PRODUCT_SESSION_SECURE:-1}
      PRODUCT_SESSION_TTL_HOURS: ${PRODUCT_SESSION_TTL_HOURS:-168}
      PRODUCT_LEGACY_OWNER: ${PRODUCT_LEGACY_OWNER:-admin}
      PRODUCT_USER_SCOPED_STATE: ${PRODUCT_USER_SCOPED_STATE:-}
      PRODUCT_STATIC_DIR: /app/dist
      PRODUCT_STORE: surreal
      PRODUCT_STATE_DB_PATH: /app/.data/product-state.db
      PRODUCT_WEB_ORIGINS: ${PRODUCT_WEB_ORIGINS:-http://127.0.0.1:3210,http://localhost:3210}
      PRODUCT_API_HEALTH_URL: ${PRODUCT_API_HEALTH_URL:-http://127.0.0.1:3210/api/health}
      CORPUS_UPLOAD_DIR: /app/.data/corpus-audio
      CORPUS_AUDIO_PUBLIC_BASE_URL: ${CORPUS_AUDIO_PUBLIC_BASE_URL:-}
      CORPUS_AUDIO_MAX_BYTES: ${CORPUS_AUDIO_MAX_BYTES:-52428800}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      BAILIAN_EMBEDDING_API_KEY: ${BAILIAN_EMBEDDING_API_KEY:-}
      BAILIAN_EMBEDDING_BASE_URL: ${BAILIAN_EMBEDDING_BASE_URL:-}
      BAILIAN_EMBEDDING_MODEL: ${BAILIAN_EMBEDDING_MODEL:-}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      BAILIAN_AUDIO_BASE_URL: ${BAILIAN_AUDIO_BASE_URL:-https://token-plan.cn-beijing.maas.aliyuncs.com}
      BAILIAN_MODEL: ${BAILIAN_MODEL:-qwen3.7-plus}
      BAILIAN_GENERAL_MODEL: ${BAILIAN_GENERAL_MODEL:-qwen3.7-plus}
      BAILIAN_SEARCH_MODEL: ${BAILIAN_SEARCH_MODEL:-qwen3.6-flash}
      BAILIAN_CHARACTER_MODEL: ${BAILIAN_CHARACTER_MODEL:-qwen3.7-plus}
      BAILIAN_INTERVIEW_REQUEST_TIMEOUT_MS: ${BAILIAN_INTERVIEW_REQUEST_TIMEOUT_MS:-120000}
      BAILIAN_REALTIME_WEBRTC_ENDPOINT: ${BAILIAN_REALTIME_WEBRTC_ENDPOINT:-}
      BAILIAN_REALTIME_TRANSPORT: ${BAILIAN_REALTIME_TRANSPORT:-websocket}
      BAILIAN_REALTIME_MODEL: ${BAILIAN_REALTIME_MODEL:-}
      BAILIAN_REALTIME_FALLBACK_MODEL: ${BAILIAN_REALTIME_FALLBACK_MODEL:-}
      BAILIAN_REALTIME_VAD: ${BAILIAN_REALTIME_VAD:-}
      BAILIAN_REALTIME_ENABLE_SEARCH: ${BAILIAN_REALTIME_ENABLE_SEARCH:-}
      BAILIAN_REALTIME_VOICE: ${BAILIAN_REALTIME_VOICE:-}
      BAILIAN_TTS_MODEL: ${BAILIAN_TTS_MODEL:-qwen-audio-3.0-tts-plus}
      BAILIAN_TTS_VOICE: ${BAILIAN_TTS_VOICE:-longanlingxin}
      BAILIAN_ASR_MODEL: ${BAILIAN_ASR_MODEL:-qwen-audio-3.0-asr-flash}
      BAILIAN_TTS_WS_URL: ${BAILIAN_TTS_WS_URL:-wss://token-plan.cn-beijing.maas.aliyuncs.com/api-ws/v1/inference}
      BAILIAN_REALTIME_WS_URL: ${BAILIAN_REALTIME_WS_URL:-wss://token-plan.cn-beijing.maas.aliyuncs.com/api-ws/v1/realtime}
      ANYSEARCH_API_KEY: ${ANYSEARCH_API_KEY:-}
      ANYSEARCH_BASE_URL: ${ANYSEARCH_BASE_URL:-https://api.anysearch.com}
      ANYSEARCH_ALLOW_ANONYMOUS: ${ANYSEARCH_ALLOW_ANONYMOUS:-false}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      PROVIDER_SMOKE_TEST_TOPIC: ${PROVIDER_SMOKE_TEST_TOPIC:-AI 产品商业化热点 provider 冒烟}
      PROVIDER_SMOKE_TEST_AUDIO_URL: ${PROVIDER_SMOKE_TEST_AUDIO_URL:-}
      PROVIDER_SMOKE_TEST_WEBRTC_OFFER_SDP: ${PROVIDER_SMOKE_TEST_WEBRTC_OFFER_SDP:-}
    volumes:
      - zhuanfang-data:/app/.data
    restart: unless-stopped

volumes:
  zhuanfang-data:
